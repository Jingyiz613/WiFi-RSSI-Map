name: miniAuto tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "miniauto-wifi-survey/**"
      - ".github/workflows/miniauto-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniauto-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    defaults:
      run:
        working-directory: miniauto-wifi-survey

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: miniauto-wifi-survey/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
